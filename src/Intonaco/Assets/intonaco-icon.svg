<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="224" height="224" rx="48" ry="48" fill="url(#bg)"/>
  <!-- Stylized "wall" texture lines - representing plaster/intonaco -->
  <line x1="56" y1="80" x2="200" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="120" x2="200" y2="120" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
  <line x1="56" y1="160" x2="200" y2="160" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-linecap="round"/>
  <!-- Play triangle - clean, centered -->
  <polygon points="108,76 108,180 188,128" fill="white" opacity="0.95"/>
</svg>
