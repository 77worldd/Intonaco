name: Prepare README demo

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct download URL for the source MP4
        required: false
        default: https://tempfile.org/gFLPJZQSyLr/download

permissions:
  contents: write

jobs:
  prepare:
    name: Download and optimize the demo video
    runs-on: ubuntu-latest

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4

      - name: Download the source video
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euxo pipefail
          curl -fL --retry 4 --retry-delay 3 --max-time 900 \
            "$SOURCE_URL" -o /tmp/intonaco-source.mp4
          ls -lh /tmp/intonaco-source.mp4
          file /tmp/intonaco-source.mp4
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_name,codec_type,width,height \
            -of json /tmp/intonaco-source.mp4 | tee /tmp/probe.json

      - name: Build optimized demo, poster and animated preview
        run: |
          set -euxo pipefail
          mkdir -p docs/demo
          python3 -m pip install --quiet pillow

          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=nw=1:nk=1 /tmp/intonaco-source.mp4)
          echo "duration=$DURATION"
          POSTER_AT=$(python3 -c "d=float('$DURATION'); print(max(0.2, min(d*0.25, 4.0)))")
          PREVIEW_START=$(python3 -c "d=float('$DURATION'); print(max(0.0, min(d*0.12, d-6.5)) if d>7 else 0.0)")
          echo "poster_at=$POSTER_AT preview_start=$PREVIEW_START"

          # Full demo: 720p H.264/AAC, faststart so browsers can play it
          # immediately. Kept small enough for a repository file.
          ffmpeg -y -hide_banner -loglevel error -i /tmp/intonaco-source.mp4 \
            -map 0:v:0 -map '0:a:0?' \
            -vf "scale='min(1280,iw)':-2:flags=lanczos" \
            -c:v libx264 -preset medium -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            docs/demo/intonaco-demo.mp4

          # Clean still frame used as the video poster.
          ffmpeg -y -hide_banner -loglevel error -ss "$POSTER_AT" \
            -i /tmp/intonaco-source.mp4 -frames:v 1 \
            -vf "scale='min(1280,iw)':-2:flags=lanczos" \
            /tmp/frame.png

          # Short, lightweight looping preview for inline README display.
          ffmpeg -y -hide_banner -loglevel error -ss "$PREVIEW_START" -t 6 \
            -i /tmp/intonaco-source.mp4 \
            -vf "fps=10,scale=800:-2:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer:bayer_scale=3" \
            -loop 0 docs/demo/intonaco-demo-preview.gif

          # Poster with a subtle scrim and a play affordance.
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          im = Image.open('/tmp/frame.png').convert('RGBA')
          w, h = im.size

          scrim = Image.new('RGBA', (w, h), (8, 12, 20, 0))
          d = ImageDraw.Draw(scrim)
          d.rectangle([0, int(h * 0.55), w, h], fill=(8, 12, 20, 70))
          im = Image.alpha_composite(im, scrim)

          radius = int(min(w, h) * 0.115)
          cx, cy = w // 2, h // 2
          glow = Image.new('RGBA', (w, h), (0, 0, 0, 0))
          g = ImageDraw.Draw(glow)
          g.ellipse([cx-radius-10, cy-radius-10, cx+radius+10, cy+radius+10],
                    fill=(96, 205, 255, 45))
          glow = glow.filter(ImageFilter.GaussianBlur(18))
          im = Image.alpha_composite(im, glow)

          d = ImageDraw.Draw(im)
          d.ellipse([cx-radius, cy-radius, cx+radius, cy+radius],
                    fill=(255, 255, 255, 235))
          t = int(radius * 0.42)
          d.polygon([(cx - t//2 - 4, cy - t), (cx - t//2 - 4, cy + t),
                     (cx + t + 2, cy)], fill=(16, 22, 32, 255))
          im.convert('RGB').save('docs/demo/intonaco-demo-poster.png',
                                 optimize=True)
          print('poster', im.size)
          PY

          cp /tmp/probe.json docs/demo/source-info.json
          ls -lh docs/demo/

      - name: Commit demo assets to the working branch
        run: |
          set -euxo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add docs/demo
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add optimized demo video, poster and preview for README [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
