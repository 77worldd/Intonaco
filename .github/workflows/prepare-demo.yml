name: Prepare README demo

on:
  push:
    branches: [arena/aec630d8-intonaco]
    paths: [.github/workflows/prepare-demo.yml]
  workflow_dispatch:
    inputs:
      source_url:
        description: Direct download URL for the source MP4
        required: false
        default: https://tempfile.org/gFLPJZQSyLr/download

permissions:
  contents: write

jobs:
  prepare:
    name: Download and optimize the demo video
    runs-on: ubuntu-latest

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4

      - name: Fetch, probe and optimize
        env:
          SOURCE_URL: ${{ inputs.source_url || 'https://tempfile.org/gFLPJZQSyLr/download' }}
          INFO_URL: https://tempfile.org/gFLPJZQSyLr/
        run: |
          set +e
          set -uxo pipefail
          mkdir -p docs/demo
          LOG=docs/demo/_diagnostics.txt
          : > "$LOG"
          exec > >(tee -a "$LOG") 2>&1

          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36'

          echo "== toolchain =="
          which curl ffmpeg ffprobe python3 || true
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -2

          echo "== download =="
          curl -sS -L --max-time 900 --retry 3 --retry-delay 2 \
            -A "$UA" -e "$INFO_URL" \
            -o /tmp/intonaco-source.mp4 \
            -w 'code=%{http_code} size=%{size_download} type=%{content_type}\n' \
            "$SOURCE_URL"
          ls -lh /tmp/intonaco-source.mp4
          file /tmp/intonaco-source.mp4
          SIZE=$(stat -c%s /tmp/intonaco-source.mp4 2>/dev/null || echo 0)
          echo "size=$SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "DOWNLOAD_FAILED"
            exit 1
          fi

          echo "== probe =="
          ffprobe -v error \
            -show_entries format=duration,size,bit_rate \
            -show_entries stream=codec_name,codec_type,width,height \
            -of json /tmp/intonaco-source.mp4 > /tmp/probe.json
          cat /tmp/probe.json
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=nw=1:nk=1 /tmp/intonaco-source.mp4)
          echo "duration=$DURATION"

          python3 -m pip install --quiet --break-system-packages pillow || \
            python3 -m pip install --quiet pillow || true
          python3 -c 'import PIL; print("Pillow", PIL.__version__)'

          POSTER_AT=$(python3 -c "d=float('$DURATION'); print(max(0.2, min(d*0.25, 4.0)))")
          PREVIEW_START=$(python3 -c "d=float('$DURATION'); print(max(0.0, min(d*0.12, d-6.5)) if d>7 else 0.0)")
          echo "poster_at=$POSTER_AT preview_start=$PREVIEW_START"

          echo "== optimized mp4 =="
          ffmpeg -y -hide_banner -loglevel warning -i /tmp/intonaco-source.mp4 \
            -map 0:v:0 -map '0:a:0?' \
            -vf "scale='min(1280,iw)':-2:flags=lanczos" \
            -c:v libx264 -preset medium -crf 26 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            docs/demo/intonaco-demo.mp4
          echo "mp4 rc=$?"

          echo "== poster frame =="
          ffmpeg -y -hide_banner -loglevel warning -ss "$POSTER_AT" \
            -i /tmp/intonaco-source.mp4 -frames:v 1 \
            -vf "scale='min(1280,iw)':-2:flags=lanczos" /tmp/frame.png
          echo "frame rc=$?"

          echo "== animated preview =="
          ffmpeg -y -hide_banner -loglevel warning -ss "$PREVIEW_START" -t 6 \
            -i /tmp/intonaco-source.mp4 \
            -vf "fps=10,scale=800:-2:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer:bayer_scale=3" \
            -loop 0 docs/demo/intonaco-demo-preview.gif
          echo "gif rc=$?"

          echo "== poster design =="
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          im = Image.open('/tmp/frame.png').convert('RGBA')
          w, h = im.size
          scrim = Image.new('RGBA', (w, h), (8, 12, 20, 0))
          ImageDraw.Draw(scrim).rectangle([0, int(h * 0.55), w, h], fill=(8, 12, 20, 70))
          im = Image.alpha_composite(im, scrim)
          radius = int(min(w, h) * 0.115)
          cx, cy = w // 2, h // 2
          glow = Image.new('RGBA', (w, h), (0, 0, 0, 0))
          ImageDraw.Draw(glow).ellipse(
              [cx-radius-10, cy-radius-10, cx+radius+10, cy+radius+10],
              fill=(96, 205, 255, 45))
          im = Image.alpha_composite(im, glow.filter(ImageFilter.GaussianBlur(18)))
          d = ImageDraw.Draw(im)
          d.ellipse([cx-radius, cy-radius, cx+radius, cy+radius], fill=(255, 255, 255, 235))
          t = int(radius * 0.42)
          d.polygon([(cx - t//2 - 4, cy - t), (cx - t//2 - 4, cy + t), (cx + t + 2, cy)],
                    fill=(16, 22, 32, 255))
          im.convert('RGB').save('docs/demo/intonaco-demo-poster.png', optimize=True)
          print('poster', im.size)
          PY
          echo "poster rc=$?"

          cp /tmp/probe.json docs/demo/source-info.json
          ls -lh docs/demo/
          echo "DONE"

      - name: Publish results to the working branch
        if: always()
        run: |
          set -euxo pipefail
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add docs/demo || true
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Add README demo assets [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
