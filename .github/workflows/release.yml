name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish official release
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          if (-not $tag.StartsWith("v")) { throw "Tag '$tag' must start with 'v'" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          Write-Host "Building release $tag"

      - name: Restore
        run: dotnet restore Intonaco.sln

      - name: Build
        run: >-
          dotnet build Intonaco.sln -c Release --no-restore
          /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Intonaco.sln -c Release --no-build

      - name: Publish (framework-dependent, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained false -o publish/framework-dependent
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/self-contained
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish installer payload (self-contained, ReadyToRun)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o publish/installer-app
          /p:Version=${{ steps.version.outputs.version }}
          /p:PublishSingleFile=false /p:PublishReadyToRun=true

      - name: Build and smoke test Windows installer
        shell: pwsh
        run: |
          try {
            Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/installer-app/

            $setup = & ./installer/Build-Installer.ps1 `
              -PublishDir publish/installer-app `
              -Version "${{ steps.version.outputs.version }}" `
              -OutputDir release

            & ./installer/Test-Installer.ps1 -SetupPath $setup
          }
          catch {
            $detail = ("$($_.Exception.Message)`n$($_.ScriptStackTrace)" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
            Write-Host "::error title=Installer build/smoke test failed::$detail"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Installer build/smoke test failed`n`n``````text`n$($_.Exception.Message)`n$($_.ScriptStackTrace)`n``````"
            throw
          }

      - name: Package zips and checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null

          # Ship the license/notices next to the executable.
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/framework-dependent/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/self-contained/

          $fd = "release/Intonaco-v$version-win-x64-framework-dependent.zip"
          $sc = "release/Intonaco-v$version-win-x64-self-contained.zip"
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath $fd
          Compress-Archive -Path publish/self-contained/* -DestinationPath $sc

          # Direct portable .exe download (the self-contained single file,
          # no unzip needed). The recommended installer was built and smoke
          # tested into this same release folder by the previous step.
          $exe = "release/Intonaco-v$version-win-x64.exe"
          Copy-Item publish/self-contained/Intonaco.exe $exe
          $setup = "release/Intonaco-v$version-win-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Installer was not found at $setup"
          }

          # Also produce plan-named aliases: Intonaco-vX-Portable.exe and Setup.exe
          $portableAlias = "release/Intonaco-v$version-Portable.exe"
          Copy-Item $exe $portableAlias
          $setupAlias = "release/Intonaco-v$version-Setup.exe"
          Copy-Item $setup $setupAlias

          $lines = foreach ($file in @($setup, $fd, $sc, $exe, $portableAlias, $setupAlias)) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Intonaco ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          body: |
            # Intonaco v${{ steps.version.outputs.version }} — Pause rendering fix & background animation modes

            **Lightweight live wallpaper for Windows 11** — video wallpapers behind your desktop icons, decoded by Windows Media Foundation (DXVA2). No VLC, no browser engine, single process. Super fast and low-resource like Lively.

            ### Downloads
            | File | Use when |
            | --- | --- |
            | `Intonaco-v${{ steps.version.outputs.version }}-win-x64-setup.exe` · `Intonaco-v${{ steps.version.outputs.version }}-Setup.exe` | **Recommended installer** — per-user install with Start Menu shortcut, optional desktop shortcut, clean uninstall, and no prerequisites |
            | `Intonaco-v${{ steps.version.outputs.version }}-win-x64.exe` · `Intonaco-v${{ steps.version.outputs.version }}-Portable.exe` | **Portable** — a single executable: download it and double-click, no installation and no prerequisites |
            | `Intonaco-v${{ steps.version.outputs.version }}-win-x64-self-contained.zip` | Same self-contained build as a zip (includes LICENSE/notices) |
            | `Intonaco-v${{ steps.version.outputs.version }}-win-x64-framework-dependent.zip` | You already have the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0) (much smaller download) |

            The installer preserves `%LocalAppData%\Intonaco` settings during upgrades/reinstalls and uninstall. For the zips: extract anywhere and run `Intonaco.exe`. Verify downloads with `SHA256SUMS.txt`.

            ### What's new in v2.0.2

            - **Critical fix: black borders/blocks when manually pausing the background.** Pause now stops only the media clock — no snapshot, no source close, no surface swap. The last rendered frame stays on the same MediaElement with identical size, position and fit, so no black regions can appear. Resume continues from that exact frame with no reopen, seek or flicker.
            - The in-app preview, fit changes while paused and Explorer-restart recovery all use the same always-rendered live surface.
            - **New setting: "Background animation when unfocused"** in the Wallpaper settings card, with two persisted modes — *Pause when app loses focus* (default) and *Keep animating when unfocused*.
            - Manual pause is now fully independent of focus events and of the selected mode: focus/system events can never resume a wallpaper the user paused explicitly.
            - The chosen mode is saved to `%LocalAppData%\Intonaco\settings.json` and restored after every restart.

            Losing focus was never the cause of the black borders (the desktop is simply covered while another app is focused); that behaviour remains intact. See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for full details and [docs/VERIFICATION.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/docs/VERIFICATION.md) for the on-device test checklist.

            **Full Changelog**: https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md
          files: |
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
