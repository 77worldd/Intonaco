name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Windows, .NET 8)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Intonaco.sln

      - name: Build
        run: dotnet build Intonaco.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test Intonaco.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Report failed tests
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { return }

          [xml]$doc = Get-Content -LiteralPath $trx.FullName
          $ns = New-Object System.Xml.XmlNamespaceManager($doc.NameTable)
          $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
          $failed = $doc.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $ns)

          foreach ($result in $failed) {
            $name = $result.GetAttribute('testName')
            $message = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $ns)?.InnerText
            $stack = $result.SelectSingleNode('t:Output/t:ErrorInfo/t:StackTrace', $ns)?.InnerText
            $detail = ("$message`n$stack" -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A')
            Write-Host "::error title=Failed test: $name::$detail"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Failed test: $name`n`n``````text`n$message`n$stack`n``````"
          }

      - name: Publish (framework-dependent, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained false -o artifacts/framework-dependent

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o artifacts/self-contained

      - name: Publish installer payload (self-contained, ReadyToRun)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o artifacts/installer-app
          /p:PublishSingleFile=false /p:PublishReadyToRun=true

      - name: Build and smoke test Windows installer
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md artifacts/installer-app/

          [xml]$projectXml = Get-Content -LiteralPath src/Intonaco/Intonaco.csproj
          $version = $projectXml.Project.PropertyGroup.Version |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if (-not $version) { throw "Could not read the project version." }

          $setup = & ./installer/Build-Installer.ps1 `
            -PublishDir artifacts/installer-app `
            -Version $version `
            -OutputDir artifacts/installer

          & ./installer/Test-Installer.ps1 -SetupPath $setup

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Intonaco-win-x64
          path: |
            artifacts/framework-dependent
            artifacts/self-contained
            artifacts/installer/*.exe
          if-no-files-found: error
