name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (Windows, .NET 8)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Intonaco.sln

      - name: Build
        run: dotnet build Intonaco.sln -c Release --no-restore

      - name: Test
        run: >-
          dotnet test Intonaco.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish (framework-dependent, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained false -o artifacts/framework-dependent

      - name: Publish (self-contained, single file)
        run: >-
          dotnet publish src/Intonaco/Intonaco.csproj -c Release -r win-x64
          --self-contained true -o artifacts/self-contained

      - name: Upload app artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Intonaco-win-x64
          path: artifacts
          if-no-files-found: error
